name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and pinned sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libarchive-tools \
            libglib2.0-bin \
            libxml2-utils \
            shellcheck

      - name: Validate repository
        run: ./tests/test-repository.sh

      - name: Verify pinned sources and patches
        run: ./tests/test-patches.sh

      - name: Test isolated installation and restore
        run: ./tests/test-install-flow.sh
