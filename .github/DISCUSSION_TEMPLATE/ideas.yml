title: "[Idea] "
labels:
  - ideas
body:
  - type: markdown
    attributes:
      value: |
        Share a focused visual or behavior idea. Include a reference and explain how it fits the preset.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed result
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: References or screenshots
